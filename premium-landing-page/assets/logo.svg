<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="gm-grad-cyan-violet" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gm-grad-glow" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="gm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Hex-Shield -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0b1120" stroke="url(#gm-grad-cyan-violet)" stroke-width="2"/>
  
  <!-- Subtle Internal Grid Pattern -->
  <circle cx="24" cy="24" r="16" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="24" cy="24" r="11" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5 2.5" opacity="0.85"/>

  <!-- Optical Crosshair Axes -->
  <line x1="8" y1="24" x2="13" y2="24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="24" x2="40" y2="24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="8" x2="24" y2="13" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="35" x2="24" y2="40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Central Dynamic Aperture / Iris Eye -->
  <circle cx="24" cy="24" r="6" fill="#0f172a" stroke="url(#gm-grad-cyan-violet)" stroke-width="2.5" filter="url(#gm-glow)"/>
  <circle cx="24" cy="24" r="2.8" fill="#38bdf8"/>
  <circle cx="25.2" cy="22.8" r="1" fill="#ffffff"/>
  
  <!-- Corner Tech Accent Ticks -->
  <path d="M7 11V7H11" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M41 11V7H37" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M7 37V41H11" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M41 37V41H37" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>
