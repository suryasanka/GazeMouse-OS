server:
  port: 8080

spring:
  application:
    name: gazemouse-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gazemouse_db}
    username: ${DB_USERNAME:gazemouse_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "https://gazemouse-os.pages.dev"

